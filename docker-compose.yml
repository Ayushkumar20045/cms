name: gbu-smart-campus

services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gbu}
      POSTGRES_USER: ${POSTGRES_USER:-gbu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql
      # Mount the single file so the image's own PostGIS init script still runs
      - ./infrastructure/db/init/01-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    ports:
      # Host port 5434 (5432/5433 are used by other local projects); containers still use db:5432
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gbu} -d ${POSTGRES_DB:-gbu}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--save", "", "--appendonly", "no"]
    # Not published to the host: only the backend container needs Redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gbu}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gbu}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gbu}:${POSTGRES_PASSWORD}@db:5432/gbu_test
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

volumes:
  db_data:
  uploads:
